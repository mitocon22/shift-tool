<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>シフト登録ツール</title>
  <!-- PWA対応 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="シフト登録">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="manifest" href='data:application/manifest+json,{"name":"\u30b7\u30d5\u30c8\u767b\u9332\u30c4\u30fc\u30eb","short_name":"\u30b7\u30d5\u30c8\u767b\u9332","display":"standalone","background_color":"%23f5f5f7","theme_color":"%23007aff","start_url":"."}'>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: -webkit-fill-available; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      padding: 28px 16px 80px;
      padding-bottom: max(80px, env(safe-area-inset-bottom, 0px) + 60px);
    }

    /* ホーム画面追加バナー */
    .add-to-home {
      background: linear-gradient(135deg, #007aff, #5ac8fa);
      border-radius: 14px; padding: 12px 16px;
      margin-bottom: 14px; display: flex; align-items: center; gap: 12px;
      color: white;
    }
    .add-to-home-icon { font-size: 24px; flex-shrink: 0; }
    .add-to-home-text { flex: 1; font-size: 12px; line-height: 1.5; }
    .add-to-home-text strong { font-size: 13px; display: block; margin-bottom: 1px; }
    .add-to-home-close {
      background: rgba(255,255,255,0.25); border: none; color: white;
      border-radius: 50%; width: 24px; height: 24px; font-size: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .container { max-width: 420px; margin: 0 auto; }

    .header { margin-bottom: 20px; }
    .header h1 { font-size: 21px; font-weight: 700; color: #1c1c1e; }
    .header p { font-size: 13px; color: #8e8e93; margin-top: 3px; }

    /* ステップ */
    .steps { display: flex; align-items: center; margin-bottom: 22px; }
    .step-item { display: flex; align-items: center; gap: 5px; flex: 1; }
    .step-circle {
      width: 27px; height: 27px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      background: #e5e5ea; color: #8e8e93; flex-shrink: 0; transition: all 0.25s;
    }
    .step-circle.active { background: #007aff; color: white; }
    .step-circle.done { background: #34c759; color: white; }
    .step-label { font-size: 11px; color: #8e8e93; font-weight: 500; }
    .step-label.active { color: #007aff; font-weight: 700; }
    .step-line { flex: 1; height: 2px; background: #e5e5ea; margin: 0 4px; border-radius: 2px; }
    .step-line.done { background: #34c759; }

    /* モード切替 */
    .mode-toggle {
      display: flex; gap: 8px; margin-bottom: 16px;
      background: #e5e5ea; border-radius: 12px; padding: 4px;
    }
    .mode-btn {
      flex: 1; padding: 9px; border: none; border-radius: 9px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      background: transparent; color: #8e8e93; transition: all 0.18s;
    }
    .mode-btn.active { background: white; color: #007aff; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

    /* カート */
    .cart-bar {
      background: white; border-radius: 14px; padding: 12px 16px;
      margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); display: none;
    }
    .cart-bar.visible { display: block; }
    .cart-title { font-size: 12px; font-weight: 700; color: #8e8e93; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .cart-item {
      display: flex; align-items: center; gap: 8px; padding: 7px 10px;
      background: #f0f7ff; border-radius: 9px; margin-bottom: 5px; font-size: 13px;
    }
    .cart-item .badge { background: #007aff; color: white; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
    .cart-item .dates-text { color: #3a3a3c; flex: 1; }
    .cart-item .remove-btn { background: none; border: none; cursor: pointer; color: #c7c7cc; font-size: 16px; padding: 0 2px; }
    .cart-item .remove-btn:hover { color: #ff3b30; }
    .cart-total { font-size: 12px; color: #8e8e93; text-align: right; margin-top: 4px; }
    .cart-total span { color: #007aff; font-weight: 700; }

    /* カード */
    .card { background: white; border-radius: 18px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); margin-bottom: 14px; }
    .card-title { font-size: 15px; font-weight: 700; color: #1c1c1e; margin-bottom: 14px; }

    /* プリセット管理 */
    .preset-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .preset-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; border: 2px solid #e5e5ea; border-radius: 12px;
      background: white; cursor: pointer; transition: all 0.18s;
    }
    .preset-item:hover { border-color: #007aff; background: #f0f7ff; }
    .preset-item.selected { border-color: #007aff; background: #f0f7ff; }
    .preset-info { flex: 1; }
    .preset-name { font-size: 15px; font-weight: 700; color: #1c1c1e; }
    .preset-time { font-size: 12px; color: #8e8e93; margin-top: 1px; }
    .preset-item.selected .preset-name { color: #007aff; }
    .preset-check { font-size: 18px; opacity: 0; transition: opacity 0.15s; }
    .preset-item.selected .preset-check { opacity: 1; }
    .preset-del {
      background: none; border: none; cursor: pointer;
      color: #c7c7cc; font-size: 18px; padding: 2px 4px;
      border-radius: 6px; transition: all 0.15s; flex-shrink: 0;
    }
    .preset-del:hover { color: #ff3b30; background: #fff0f0; }
    .preset-edit {
      background: none; border: none; cursor: pointer;
      color: #c7c7cc; font-size: 15px; padding: 2px 6px;
      border-radius: 6px; transition: all 0.15s; flex-shrink: 0;
    }
    .preset-edit:hover { color: #007aff; background: #f0f7ff; }

    /* 空状態 */
    .empty-state {
      text-align: center; padding: 20px 0 8px;
      color: #8e8e93; font-size: 14px; line-height: 1.7;
    }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 6px; }

    /* 追加フォーム */
    .add-form {
      background: #f9f9fb; border-radius: 14px; padding: 14px;
      border: 1.5px solid #e5e5ea; margin-top: 4px;
      display: none;
    }
    .add-form.open { display: block; }
    .add-form-title { font-size: 13px; font-weight: 700; color: #636366; margin-bottom: 10px; }
    .form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
    .form-label { font-size: 12px; color: #8e8e93; font-weight: 600; width: 52px; flex-shrink: 0; }
    .form-input {
      flex: 1; padding: 9px 11px; border: 1.5px solid #e5e5ea; border-radius: 10px;
      font-size: 14px; color: #1c1c1e; font-weight: 500; outline: none;
      transition: border-color 0.18s; background: white;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    }
    .form-input:focus { border-color: #007aff; }
    .time-row { display: flex; align-items: center; gap: 6px; flex: 1; }
    .time-input-s {
      flex: 1; padding: 9px; border: 1.5px solid #e5e5ea; border-radius: 10px;
      font-size: 14px; text-align: center; color: #1c1c1e; font-weight: 600;
      outline: none; transition: border-color 0.18s; background: white;
    }
    .time-input-s:focus { border-color: #007aff; }
    .time-sep { font-size: 16px; color: #8e8e93; font-weight: 700; }
    .form-save-row { display: flex; gap: 8px; margin-top: 4px; }
    .btn-save {
      flex: 1; padding: 11px; background: #007aff; color: white;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-save:hover { background: #0062cc; }
    .btn-cancel {
      padding: 11px 16px; background: #f2f2f7; color: #636366;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
      cursor: pointer;
    }

    .add-preset-btn {
      width: 100%; padding: 11px; border: 2px dashed #c7c7cc; border-radius: 12px;
      background: transparent; color: #8e8e93; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.18s; display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .add-preset-btn:hover { border-color: #007aff; color: #007aff; background: #f0f7ff; }
    .add-preset-btn.open { border-color: #007aff; color: #007aff; }

    /* 設定パネル */
    .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .settings-toggle {
      background: none; border: none; cursor: pointer;
      font-size: 20px; padding: 2px 4px; color: #8e8e93; flex-shrink: 0; line-height: 1;
    }
    .settings-panel {
      background: white; border-radius: 14px; padding: 16px;
      margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel-title { font-size: 13px; font-weight: 700; color: #636366; margin-bottom: 12px; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .settings-label { font-size: 14px; color: #1c1c1e; font-weight: 500; }
    .settings-ctrl { display: flex; align-items: center; gap: 6px; }
    .settings-num {
      width: 62px; padding: 7px 9px; border: 1.5px solid #e5e5ea;
      border-radius: 10px; font-size: 15px; font-weight: 700; text-align: center;
      color: #1c1c1e; outline: none;
    }
    .settings-num:focus { border-color: #007aff; }
    .settings-unit { font-size: 14px; color: #8e8e93; }
    .settings-hint { font-size: 12px; color: #8e8e93; margin-top: 10px; line-height: 1.5; }

    /* カレンダー */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav button { background: none; border: none; font-size: 20px; cursor: pointer; color: #007aff; padding: 4px 10px; border-radius: 8px; }
    .cal-nav button:hover { background: #f0f7ff; }
    .cal-month { font-size: 16px; font-weight: 700; color: #1c1c1e; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 11px; font-weight: 700; color: #8e8e93; padding: 3px 0; }
    .cal-dow:first-child { color: #ff3b30; }
    .cal-dow:last-child { color: #007aff; }
    .cal-day {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; font-size: 14px; font-weight: 500;
      cursor: pointer; color: #1c1c1e; transition: all 0.15s; user-select: none;
    }
    .cal-day:hover:not(.empty):not(.past) { background: #e8f0fe; }
    .cal-day.selected { background: #007aff; color: white; font-weight: 700; }
    .cal-day.today { font-weight: 800; color: #007aff; }
    .cal-day.today.selected { background: #007aff; color: white; }
    .cal-day.empty, .cal-day.past { cursor: default; }
    .cal-day.past { color: #c7c7cc; }
    .cal-day.sun { color: #ff3b30; }
    .cal-day.sun.selected { background: #ff3b30; color: white; }
    .cal-day.sat { color: #007aff; }
    .cal-day.sat.selected { color: white; }
    .cal-day.past.sun, .cal-day.past.sat { color: #c7c7cc; }
    .cal-day.work-default { background: #f0f7ff; color: #007aff; font-weight: 700; border-radius: 50%; }
    .cal-day.work-default.sun { background: #fff0f0; color: #ff3b30; }
    .cal-day.work-default.sat { background: #f0f7ff; color: #007aff; }
    .cal-day.off-day { background: #f2f2f7; color: #c7c7cc; font-weight: 500; }
    .cal-day.off-day.sun, .cal-day.off-day.sat { background: #f2f2f7; color: #c7c7cc; }

    /* カウント */
    .selected-count { text-align: center; font-size: 13px; color: #8e8e93; margin-top: 10px; }
    .selected-count span { color: #007aff; font-weight: 700; }
    .selected-count .off-count { color: #8e8e93; font-weight: 700; }
    .selected-count .work-count { color: #007aff; font-weight: 700; }

    /* ボタン */
    .btn-row { display: flex; gap: 9px; margin-top: 16px; }
    .btn { flex: 1; padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; transition: all 0.18s; }
    .btn-primary { background: #007aff; color: white; }
    .btn-primary:hover { background: #0062cc; }
    .btn-primary:disabled { background: #b0d0ff; cursor: not-allowed; }
    .btn-secondary { background: #f2f2f7; color: #007aff; flex: 0.55; }
    .btn-secondary:hover { background: #e5e5ea; }
    .btn-green { background: #34c759; color: white; }
    .btn-green:hover { background: #28a745; }
    .btn-green:disabled { background: #a8e4b8; cursor: not-allowed; }

    /* 完了画面 */
    .done-card { background: white; border-radius: 18px; padding: 28px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
    .done-icon { font-size: 52px; margin-bottom: 12px; }
    .done-title { font-size: 18px; font-weight: 700; color: #1c1c1e; margin-bottom: 6px; }
    .done-sub { font-size: 13px; color: #8e8e93; line-height: 1.6; margin-bottom: 20px; }
    .copy-box {
      background: #f9f9fb; border-radius: 12px; padding: 14px; font-size: 12px; color: #3a3a3c;
      line-height: 1.8; text-align: left; white-space: pre-wrap;
      word-break: break-all; max-height: 200px; overflow-y: auto;
      border: 1.5px solid #e5e5ea; margin-bottom: 14px;
    }
    .copy-btn {
      width: 100%; padding: 15px; background: #007aff; color: white;
      border: none; border-radius: 13px; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-bottom: 10px; transition: all 0.18s;
    }
    .copy-btn:hover { background: #0062cc; }
    .copy-btn.copied { background: #34c759; }

    /* AIリンクボタン */
    .ai-links { display: none; gap: 9px; margin-bottom: 10px; }
    .ai-links.visible { display: flex; }
    .ai-link-btn {
      flex: 1; padding: 11px 8px; border-radius: 11px; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: flex; align-items: center;
      justify-content: center; gap: 5px; transition: all 0.18s;
    }
    .ai-link-gemini { background: #e8f5e9; color: #1a7340; }
    .ai-link-gemini:hover { background: #c8e6c9; }
    .ai-link-claude { background: #fff3e0; color: #e65100; }
    .ai-link-claude:hover { background: #ffe0b2; }

    .ics-btn {
      width: 100%; padding: 13px; background: #e8f0fe; color: #1a56b0;
      border: none; border-radius: 13px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-bottom: 10px; transition: all 0.18s;
      display: none;
    }
    .ics-btn.visible { display: block; }
    .ics-btn:hover { background: #c7d9fc; }

    .reset-btn {
      background: #f2f2f7; color: #636366; border: none;
      border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .reset-btn:hover { background: #e5e5ea; }

    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>
<div class="container">
  <!-- ホーム画面追加バナー（iOSのみ表示） -->
  <div class="add-to-home" id="addToHomeBanner" style="display:none;">
    <div class="add-to-home-icon">📲</div>
    <div class="add-to-home-text">
      <strong>ホーム画面に追加できます！</strong>
      Safari下の共有ボタン →「ホーム画面に追加」でアプリとして使えます
    </div>
    <button class="add-to-home-close" onclick="dismissBanner()">✕</button>
  </div>

  <div class="header">
    <div class="header-row">
      <div>
        <h1>📅 シフト登録ツール</h1>
        <p>シフトを選んで、日付を選んで、まとめて登録！</p>
      </div>
      <button class="settings-toggle" onclick="toggleSettings()" title="設定">⚙️</button>
    </div>
  </div>

  <!-- 設定パネル -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-panel-title">⚙️ 設定</div>
    <div class="settings-row">
      <div class="settings-label">デフォルト勤務時間</div>
      <div class="settings-ctrl">
        <input type="number" class="settings-num" id="workDurInput" min="1" max="24" value="9" oninput="saveSettings()">
        <span class="settings-unit">時間</span>
      </div>
    </div>
    <div class="settings-hint">開始時間を入力すると、終了時間がここで設定した時間数で自動計算されます</div>
  </div>

  <!-- ステップ -->
  <div class="steps" id="stepsBar">
    <div class="step-item">
      <div class="step-circle active" id="sc1">1</div>
      <div class="step-label active" id="sl1">シフト</div>
    </div>
    <div class="step-line" id="line1"></div>
    <div class="step-item">
      <div class="step-circle" id="sc2">2</div>
      <div class="step-label" id="sl2">日付</div>
    </div>
    <div class="step-line" id="line2"></div>
    <div class="step-item">
      <div class="step-circle" id="sc3">3</div>
      <div class="step-label" id="sl3">登録</div>
    </div>
  </div>

  <!-- カート -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-title">追加済みシフト</div>
    <div id="cartItems"></div>
    <div class="cart-total" id="cartTotal"></div>
  </div>

  <!-- STEP 1: シフト選択 -->
  <div class="page active" id="page1">
    <!-- モード切替 -->
    <div class="mode-toggle">
      <button class="mode-btn" id="modeWork" onclick="setMode('work')">✏️ 仕事日を選ぶ</button>
      <button class="mode-btn active" id="modeOff" onclick="setMode('off')">🌴 休みを選ぶ</button>
    </div>

    <div class="card">
      <div class="card-title">⏰ シフトを選んでください</div>

      <!-- プリセット一覧 -->
      <div class="preset-list" id="presetList"></div>

      <!-- 追加ボタン -->
      <button class="add-preset-btn" id="addBtn" onclick="toggleAddForm()">
        <span>＋</span><span>シフトを追加</span>
      </button>

      <!-- 追加／編集フォーム -->
      <div class="add-form" id="addForm">
        <div class="add-form-title" id="addFormTitle">新しいシフトを追加</div>
        <div class="form-row">
          <div class="form-label">シフト名</div>
          <input class="form-input" type="text" id="newName" placeholder="例：早番、遅番、通常" maxlength="20">
        </div>
        <div class="form-row">
          <div class="form-label">開始〜終了</div>
          <div class="time-row">
            <input class="time-input-s" type="time" id="newStart" value="09:00">
            <span class="time-sep">〜</span>
            <input class="time-input-s" type="time" id="newEnd" value="18:00">
          </div>
        </div>
        <div class="form-save-row">
          <button class="btn-cancel" onclick="cancelForm()">キャンセル</button>
          <button class="btn-save" id="saveBtn" onclick="savePreset()">保存する</button>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="nextBtn1" onclick="goStep2()" disabled>日付を選ぶ →</button>
    </div>
  </div>

  <!-- STEP 2: 日付選択 -->
  <div class="page" id="page2">
    <div class="card">
      <div class="card-title" id="step2Title">📆 日付を選んでください（複数OK）</div>
      <div class="cal-nav">
        <button onclick="prevMonth()">‹</button>
        <div class="cal-month" id="calMonth"></div>
        <button onclick="nextMonth()">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="selected-count" id="selectedCount"></div>
    </div>
    <div class="btn-row" id="step2Btns">
      <button class="btn btn-secondary" onclick="goStep1()">← 戻る</button>
      <button class="btn btn-primary" id="addMoreBtn" onclick="addToCart()" style="display:none" disabled>＋ 追加して<br>別シフトも入力</button>
      <button class="btn btn-green" id="finalBtn" onclick="finalize()" disabled>✓ まとめて<br>登録する</button>
    </div>
  </div>

  <!-- STEP 3: 完了 -->
  <div class="page" id="page3">
    <div class="done-card">
      <div class="done-icon">📋</div>
      <div class="done-title">確認してコピー！</div>
      <div class="done-sub">内容を確認して、ボタンを押してコピーしてください。<br>Claudeのチャットに貼り付けるだけで登録できます。</div>
      <div class="copy-box" id="finalText"></div>
      <button class="copy-btn" id="copyBtn" onclick="doCopy()">📋 コピーする</button>
      <button class="ics-btn" id="icsBtn" onclick="downloadICS()">📅 カレンダーに追加（.ics）</button>
      <div class="ai-links" id="aiLinks">
        <button class="ai-link-btn ai-link-gemini" onclick="openAI('https://gemini.google.com', 'gemini://')">✨ Geminiに貼り付ける</button>
        <button class="ai-link-btn ai-link-claude" onclick="openAI('https://claude.ai', 'claude://')">🤖 Claudeに貼り付ける</button>
      </div>
      <button class="reset-btn" onclick="resetAll()">🔄 新しいシフトを入力する</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'shiftPresets_v1';
  const SETTINGS_KEY = 'shiftSettings_v1';
  const WEEKDAYS = ['日','月','火','水','木','金','土'];

  let presets = [];
  let selectedPreset = null; // {id, name, start, end}
  let selectedDates = new Set();
  let offDates = new Set();
  let cart = [];
  let inputMode = 'off';
  let calYear, calMonth;
  let finalizedShifts = [];
  let workDuration = 9;
  let editingPresetId = null;
  const today = new Date();
  today.setHours(0,0,0,0);
  // カレンダーは次月から表示
  calYear = today.getFullYear();
  calMonth = today.getMonth() + 1;
  if (calMonth > 11) { calMonth = 0; calYear++; }

  /* ---- プリセット管理 ---- */
  function loadPresets() {
    try { presets = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { presets = []; }
  }

  function savePresetsToStorage() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(presets)); } catch {}
  }

  /* ---- 設定 ---- */
  function loadSettings() {
    try {
      const s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if (s && s.workDuration) workDuration = s.workDuration;
    } catch {}
    document.getElementById('workDurInput').value = workDuration;
  }

  function saveSettings() {
    workDuration = parseInt(document.getElementById('workDurInput').value, 10) || 9;
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify({ workDuration })); } catch {}
  }

  function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('open');
  }

  function onStartChange() {
    const v = document.getElementById('newStart').value;
    if (!v) return;
    const [h, m] = v.split(':').map(Number);
    const total = h * 60 + m + workDuration * 60;
    const eh = Math.floor(total / 60) % 24;
    const em = total % 60;
    document.getElementById('newEnd').value =
      String(eh).padStart(2, '0') + ':' + String(em).padStart(2, '0');
  }

  function renderPresets() {
    const list = document.getElementById('presetList');
    list.innerHTML = '';

    if (presets.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">✨</div>
          <div>まだシフトがありません。<br>下の「シフトを追加」から追加してみましょう！</div>
        </div>`;
      document.getElementById('nextBtn1').disabled = true;
      return;
    }

    presets.forEach(p => {
      const item = document.createElement('div');
      item.className = 'preset-item' + (selectedPreset && selectedPreset.id === p.id ? ' selected' : '');
      item.dataset.id = p.id;
      const fmtT = t => t.replace(/^0/, '');
      item.innerHTML = `
        <div class="preset-info" onclick="selectPreset('${p.id}')">
          <div class="preset-name">${escHtml(p.name)}</div>
          <div class="preset-time">${fmtT(p.start)} 〜 ${fmtT(p.end)}</div>
        </div>
        <div class="preset-check">✓</div>
        <button class="preset-edit" onclick="editPreset('${p.id}')" title="編集">✎</button>
        <button class="preset-del" onclick="deletePreset('${p.id}')" title="削除">✕</button>`;
      list.appendChild(item);
    });
  }

  function selectPreset(id) {
    selectedPreset = presets.find(p => p.id === id) || null;
    document.getElementById('nextBtn1').disabled = !selectedPreset;
    renderPresets();
  }

  function deletePreset(id) {
    if (!confirm('このシフトを削除しますか？')) return;
    presets = presets.filter(p => p.id !== id);
    if (selectedPreset && selectedPreset.id === id) selectedPreset = null;
    savePresetsToStorage();
    renderPresets();
    document.getElementById('nextBtn1').disabled = !selectedPreset;
  }

  let addFormOpen = false;

  function toggleAddForm() {
    if (editingPresetId) { cancelForm(); return; }
    addFormOpen = !addFormOpen;
    document.getElementById('addForm').classList.toggle('open', addFormOpen);
    document.getElementById('addBtn').classList.toggle('open', addFormOpen);
    if (addFormOpen) {
      document.getElementById('addFormTitle').textContent = '新しいシフトを追加';
      document.getElementById('saveBtn').textContent = '保存する';
      document.getElementById('newName').value = '';
      document.getElementById('newStart').value = '09:00';
      onStartChange();
      document.getElementById('newName').focus();
    }
  }

  function editPreset(id) {
    const p = presets.find(x => x.id === id);
    if (!p) return;
    editingPresetId = id;
    document.getElementById('newName').value = p.name;
    document.getElementById('newStart').value = p.start;
    document.getElementById('newEnd').value = p.end;
    document.getElementById('addFormTitle').textContent = 'シフトを編集';
    document.getElementById('saveBtn').textContent = '更新する';
    document.getElementById('addForm').classList.add('open');
    document.getElementById('addBtn').classList.add('open');
    addFormOpen = true;
    document.getElementById('newName').focus();
  }

  function cancelForm() {
    editingPresetId = null;
    addFormOpen = false;
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('addBtn').classList.remove('open');
    document.getElementById('addFormTitle').textContent = '新しいシフトを追加';
    document.getElementById('saveBtn').textContent = '保存する';
  }

  function savePreset() {
    const name = document.getElementById('newName').value.trim();
    const start = document.getElementById('newStart').value;
    const end = document.getElementById('newEnd').value;
    if (!name) { alert('シフト名を入力してください'); return; }
    if (!start || !end) { alert('時間を入力してください'); return; }

    if (editingPresetId) {
      const p = presets.find(x => x.id === editingPresetId);
      if (p) {
        p.name = name; p.start = start; p.end = end;
        if (selectedPreset && selectedPreset.id === editingPresetId) {
          selectedPreset = { ...p };
        }
      }
      editingPresetId = null;
    } else {
      const newPreset = { id: Date.now().toString(), name, start, end };
      presets.push(newPreset);
      selectedPreset = newPreset;
      document.getElementById('nextBtn1').disabled = false;
    }

    savePresetsToStorage();
    addFormOpen = false;
    document.getElementById('addForm').classList.remove('open');
    document.getElementById('addBtn').classList.remove('open');
    document.getElementById('addFormTitle').textContent = '新しいシフトを追加';
    document.getElementById('saveBtn').textContent = '保存する';
    renderPresets();
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ---- モード ---- */
  function setMode(mode) {
    inputMode = mode;
    document.getElementById('modeWork').classList.toggle('active', mode === 'work');
    document.getElementById('modeOff').classList.toggle('active', mode === 'off');
    document.getElementById('addMoreBtn').style.display = mode === 'off' ? 'none' : '';
    document.getElementById('cartBar').classList.remove('visible');
    cart = [];
  }

  /* ---- Step 2: カレンダー ---- */
  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    document.getElementById('calMonth').textContent = `${calYear}年${calMonth + 1}月`;

    if (inputMode === 'off') {
      document.getElementById('step2Title').textContent = '🌴 休みの日をタップしてください';
    } else {
      const fmtT = t => t ? t.replace(/^0/, '') : '';
      const label = selectedPreset ? `${escHtml(selectedPreset.name)} ${fmtT(selectedPreset.start)}〜${fmtT(selectedPreset.end)}` : '';
      document.getElementById('step2Title').textContent = `📆 ${label} の日付を選んでください`;
    }

    WEEKDAYS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cal-dow';
      el.textContent = d;
      grid.appendChild(el);
    });

    const firstDay = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const el = document.createElement('div');
      el.className = 'cal-day empty';
      grid.appendChild(el);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(calYear, calMonth, d);
      const key = dateKey(date);
      const el = document.createElement('div');
      const dow = date.getDay();

      if (inputMode === 'off') {
        let cls = 'cal-day';
        if (dow === 0) cls += ' sun';
        if (dow === 6) cls += ' sat';
        if (offDates.has(key)) cls += ' off-day';
        else cls += ' work-default';
        el.className = cls;
        el.textContent = d;
        el.addEventListener('click', () => toggleOff(key, el, dow));
      } else {
        let cls = 'cal-day';
        if (dow === 0) cls += ' sun';
        if (dow === 6) cls += ' sat';
        if (date < today) cls += ' past';
        if (date.getTime() === today.getTime()) cls += ' today';
        if (selectedDates.has(key)) cls += ' selected';
        el.className = cls;
        el.textContent = d;
        if (date >= today) el.addEventListener('click', () => toggleDate(key, el));
      }
      grid.appendChild(el);
    }
    updateCount();
  }

  function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  function toggleDate(key, el) {
    if (selectedDates.has(key)) { selectedDates.delete(key); el.classList.remove('selected'); }
    else { selectedDates.add(key); el.classList.add('selected'); }
    updateCount();
  }

  function toggleOff(key, el, dow) {
    if (offDates.has(key)) {
      offDates.delete(key);
      el.classList.remove('off-day');
      el.classList.add('work-default');
    } else {
      offDates.add(key);
      el.classList.add('off-day');
      el.classList.remove('work-default');
    }
    updateCount();
  }

  function getDaysInMonth() {
    return new Date(calYear, calMonth + 1, 0).getDate();
  }

  function updateCount() {
    const el = document.getElementById('selectedCount');
    if (inputMode === 'off') {
      const total = getDaysInMonth();
      const offCount = offDates.size;
      const workCount = total - offCount;
      el.innerHTML = `仕事 <span class="work-count">${workCount}日</span>　休み <span class="off-count">${offCount}日</span>`;
      document.getElementById('finalBtn').disabled = false;
    } else {
      const n = selectedDates.size;
      document.getElementById('addMoreBtn').disabled = n === 0;
      document.getElementById('finalBtn').disabled = n === 0;
      el.innerHTML = n === 0 ? '日付を選んでください' : `<span>${n}日</span> 選択中`;
    }
  }

  function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } offDates = new Set(); renderCalendar(); }
  function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } offDates = new Set(); renderCalendar(); }

  function addToCart() {
    const dates = [...selectedDates].sort();
    cart.push({ name: selectedPreset.name, start: selectedPreset.start, end: selectedPreset.end, dates });
    renderCart();
    selectedDates = new Set();
    selectedPreset = null;
    renderPresets();
    document.getElementById('nextBtn1').disabled = true;
    goStep1();
  }

  function renderCart() {
    const bar = document.getElementById('cartBar');
    const items = document.getElementById('cartItems');
    const total = document.getElementById('cartTotal');
    if (cart.length === 0) { bar.classList.remove('visible'); return; }
    bar.classList.add('visible');
    items.innerHTML = '';
    let totalDays = 0;
    cart.forEach((group, idx) => {
      totalDays += group.dates.length;
      const fmtT = t => t.replace(/^0/, '');
      const preview = group.dates.slice(0, 3).map(k => {
        const d = new Date(k + 'T00:00:00');
        return `${d.getMonth()+1}/${d.getDate()}`;
      }).join('、') + (group.dates.length > 3 ? `…+${group.dates.length - 3}日` : '');
      const item = document.createElement('div');
      item.className = 'cart-item';
      item.innerHTML = `
        <span class="badge">${escHtml(group.name)} ${fmtT(group.start)}〜${fmtT(group.end)}</span>
        <span class="dates-text">${preview}（${group.dates.length}日）</span>
        <button class="remove-btn" onclick="removeCart(${idx})">✕</button>`;
      items.appendChild(item);
    });
    total.innerHTML = `合計 <span>${totalDays}日分</span> 登録予定`;
  }

  function removeCart(idx) { cart.splice(idx, 1); renderCart(); }

  function finalize() {
    const WDAYS = ['日','月','火','水','木','金','土'];
    const fmtT = t => t.replace(/^0/, '');
    let lines = ['以下のシフトをGoogleカレンダーに登録して：'];

    finalizedShifts = [];

    if (inputMode === 'off') {
      const daysInMonth = getDaysInMonth();
      const workDates = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(calYear, calMonth, d);
        const key = dateKey(date);
        if (!offDates.has(key)) workDates.push(key);
      }
      if (workDates.length === 0) { alert('仕事日が0日です。休みを減らしてください。'); return; }
      lines.push(`\n${selectedPreset.name} ${fmtT(selectedPreset.start)}:00〜${fmtT(selectedPreset.end)}:00`);
      workDates.forEach(k => {
        const d = new Date(k + 'T00:00:00');
        lines.push(`・${d.getMonth()+1}月${d.getDate()}日（${WDAYS[d.getDay()]}）`);
      });
      finalizedShifts.push({ name: selectedPreset.name, start: selectedPreset.start, end: selectedPreset.end, dates: workDates });
    } else {
      if (selectedDates.size > 0 && selectedPreset) {
        cart.push({ name: selectedPreset.name, start: selectedPreset.start, end: selectedPreset.end, dates: [...selectedDates].sort() });
      }
      if (cart.length === 0) return;
      cart.forEach(group => {
        lines.push(`\n${group.name} ${fmtT(group.start)}:00〜${fmtT(group.end)}:00`);
        group.dates.forEach(k => {
          const d = new Date(k + 'T00:00:00');
          lines.push(`・${d.getMonth()+1}月${d.getDate()}日（${WDAYS[d.getDay()]}）`);
        });
        finalizedShifts.push({ name: group.name, start: group.start, end: group.end, dates: [...group.dates] });
      });
    }

    const text = lines.join('\n');
    document.getElementById('finalText').textContent = text;
    showPage(3);
    updateSteps(3);
    document.getElementById('stepsBar').style.display = 'none';
    document.getElementById('cartBar').classList.remove('visible');
    const btn = document.getElementById('copyBtn');
    btn.textContent = '📋 コピーする';
    btn.classList.remove('copied');
    document.getElementById('aiLinks').classList.remove('visible');
    document.getElementById('icsBtn').classList.remove('visible');
  }

  function resetAll() {
    cart = []; selectedDates = new Set(); offDates = new Set();
    selectedPreset = null;
    renderPresets();
    document.getElementById('nextBtn1').disabled = true;
    document.getElementById('stepsBar').style.display = 'flex';
    renderCart();
    showPage(1);
    updateSteps(1);
  }

  function doCopy() {
    const text = document.getElementById('finalText').textContent;
    const btn = document.getElementById('copyBtn');
    const done = () => {
      btn.textContent = '✅ コピーしました！';
      btn.classList.add('copied');
      document.getElementById('aiLinks').classList.add('visible');
      document.getElementById('icsBtn').classList.add('visible');
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else { fallbackCopy(text, done); }
  }

  function fallbackCopy(text, callback) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    callback();
  }

  function goStep1() { showPage(1); updateSteps(1); }
  function goStep2() {
    if (!selectedPreset) return;
    showPage(2); updateSteps(2); renderCalendar();
  }

  function showPage(n) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page' + n).classList.add('active');
  }

  function updateSteps(active) {
    for (let i = 1; i <= 3; i++) {
      const sc = document.getElementById('sc' + i);
      const sl = document.getElementById('sl' + i);
      sc.classList.remove('active','done');
      sl.classList.remove('active');
      if (i < active) { sc.classList.add('done'); document.getElementById('line' + i) && document.getElementById('line' + i).classList.add('done'); }
      else if (i === active) { sc.classList.add('active'); sl.classList.add('active'); }
      if (i < 3) document.getElementById('line' + i).classList.toggle('done', i < active);
    }
  }

  /* ---- 初期化 ---- */
  loadPresets();
  loadSettings();
  renderPresets();

  document.getElementById('newStart').addEventListener('change', onStartChange);
  document.getElementById('newName').addEventListener('keydown', e => { if (e.key === 'Enter') savePreset(); });

  // ホーム画面追加バナー：iOSのSafariでスタンドアロンでない場合のみ表示
  (function() {
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.navigator.standalone === true;
    const dismissed = localStorage.getItem('addToHomeDismissed');
    if (isIOS && !isStandalone && !dismissed) {
      document.getElementById('addToHomeBanner').style.display = 'flex';
    }
  })();

  function downloadICS() {
    if (!finalizedShifts.length) return;
    const pad = n => String(n).padStart(2, '0');
    const fmtDT = (dateKey, hour) => {
      const d = new Date(dateKey + 'T00:00:00');
      return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(parseInt(hour,10))}0000`;
    };
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//シフト登録ツール//JP',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VTIMEZONE',
      'TZID:Asia/Tokyo',
      'BEGIN:STANDARD',
      'DTSTART:19700101T000000',
      'TZOFFSETFROM:+0900',
      'TZOFFSETTO:+0900',
      'TZNAME:JST',
      'END:STANDARD',
      'END:VTIMEZONE',
    ];
    finalizedShifts.forEach(group => {
      group.dates.forEach(k => {
        const start = fmtDT(k, group.start);
        const end = fmtDT(k, group.end);
        lines.push(
          'BEGIN:VEVENT',
          `DTSTART;TZID=Asia/Tokyo:${start}`,
          `DTEND;TZID=Asia/Tokyo:${end}`,
          `SUMMARY:${group.name}`,
          `UID:shift-${start}-${Math.random().toString(36).slice(2)}@shiftapp`,
          'END:VEVENT'
        );
      });
    });
    lines.push('END:VCALENDAR');
    const content = lines.join('\r\n') + '\r\n';
    const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'shift.ics';
    a.click();
    URL.revokeObjectURL(url);
  }

  function openAI(webUrl, appScheme) {
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS && appScheme) {
      let appOpened = false;
      const onVisibility = () => { if (document.hidden) appOpened = true; };
      document.addEventListener('visibilitychange', onVisibility);
      window.location.href = appScheme;
      setTimeout(() => {
        document.removeEventListener('visibilitychange', onVisibility);
        if (!appOpened) window.open(webUrl, '_blank');
      }, 1000);
    } else {
      window.open(webUrl, '_blank');
    }
  }

  function dismissBanner() {
    document.getElementById('addToHomeBanner').style.display = 'none';
    try { localStorage.setItem('addToHomeDismissed', '1'); } catch {}
  }

  /* ---- アプリアイコン生成 ---- */
